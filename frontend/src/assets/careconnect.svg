<svg
  width="120"
  height="120"
  viewBox="0 0 120 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Outer Circle -->
  <circle
    cx="60"
    cy="60"
    r="56"
    stroke="#16A34A"
    stroke-width="6"
  />

  <!-- Medical Cross -->
  <rect x="52" y="30" width="16" height="60" rx="4" fill="#16A34A" />
  <rect x="30" y="52" width="60" height="16" rx="4" fill="#16A34A" />

  <!-- Connection Dots -->
  <circle cx="20" cy="60" r="5" fill="#22C55E" />
  <circle cx="100" cy="60" r="5" fill="#22C55E" />
  <circle cx="60" cy="20" r="5" fill="#22C55E" />
  <circle cx="60" cy="100" r="5" fill="#22C55E" />

  <!-- Connecting Lines -->
  <line x1="25" y1="60" x2="40" y2="60" stroke="#22C55E" stroke-width="3" />
  <line x1="80" y1="60" x2="95" y2="60" stroke="#22C55E" stroke-width="3" />
  <line x1="60" y1="25" x2="60" y2="40" stroke="#22C55E" stroke-width="3" />
  <line x1="60" y1="80" x2="60" y2="95" stroke="#22C55E" stroke-width="3" />
</svg>
